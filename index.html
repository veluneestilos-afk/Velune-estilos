<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="VELUNE | Contemporary Essentials. Moda com estilo, presença e identidade."><title>VELUNE | Contemporary Essentials</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
:root{--bg:#0a0a0b;--sf:#141416;--ln:#2a2a2e;--tx:#f2f2f2;--mu:#a0a0a8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:#0a0a0b;color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
.sf{font-family:'Cormorant Garamond',Georgia,serif}
.mu{color:var(--mu)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.btn{display:inline-block;background:#f4f4f4;color:#0a0a0b;border:0;padding:13px 26px;font-weight:600;letter-spacing:.06em;cursor:pointer;text-align:center}
.btn.g{background:none;color:var(--tx);border:1px solid #555}
.btn.sm{padding:8px 14px;font-size:13px}
.intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#2b2b30 0,#0a0a0b 62%);z-index:50;transition:opacity .7s}
.intro.out{opacity:0;pointer-events:none}
.intro img{width:min(46vw,210px);filter:drop-shadow(0 0 28px #ffffff55);animation:rise 1.6s ease both}
.intro h1{font:600 clamp(44px,12vw,84px)/1 'Cormorant Garamond',Georgia,serif;letter-spacing:.3em;margin:22px -0.3em 8px 0;animation:rise 1.6s .5s ease both}
.intro p{color:var(--mu);letter-spacing:.2em;margin:0 0 34px;animation:rise 1.6s 1s ease both}
.intro .btn{animation:rise 1.2s 1.6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro *{animation:none!important}}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#0a0a0bee;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln);display:flex;gap:14px;align-items:center;padding:12px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0}
.brand img{height:34px}
.brand span{font:600 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:.2em}
#q{flex:1;min-width:180px;background:var(--sf);border:1px solid var(--ln);padding:11px 14px;border-radius:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px;border-bottom:1px solid var(--ln)}
.chip{white-space:nowrap;background:none;border:1px solid var(--ln);padding:7px 15px;border-radius:99px;cursor:pointer;color:var(--mu)}
.chip.on{background:#f4f4f4;color:#0a0a0b;border-color:#f4f4f4}
main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:12px}
.card{background:var(--sf);border:1px solid var(--ln);display:block}
.im{aspect-ratio:1;background:#0f0f11;display:flex;align-items:center;justify-content:center;overflow:hidden}
.im img{width:100%;height:100%;object-fit:cover}
.im img.ph{width:34%;height:auto;opacity:.18}
.ci{padding:12px 14px 16px;display:flex;flex-direction:column;gap:2px}
.cn{font-weight:500}.ci s{color:var(--mu);font-size:13px}.ci b{font-size:20px}.ci small{color:var(--mu)}
.empty{grid-column:1/-1;text-align:center;padding:60px 0}
.pg{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;margin-top:14px}
.gal{display:flex;gap:10px}.th{display:flex;flex-direction:column;gap:8px}
.th button{width:58px;height:58px;padding:0;border:1px solid var(--ln);background:#0f0f11;cursor:pointer}
.th button.on{border-color:#fff}.th img{width:100%;height:100%;object-fit:cover}
.mn{flex:1;aspect-ratio:1;background:#0f0f11;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center}
.mn img{width:100%;height:100%;object-fit:contain}.mn img.ph{width:30%;opacity:.18;height:auto}
.inf{background:var(--sf);border:1px solid var(--ln);padding:24px;align-self:start}
.inf h2{font:600 34px/1.1 'Cormorant Garamond',Georgia,serif;margin:6px 0 14px}
.pr{font-size:34px;font-weight:600}.off{color:#7ee0a0;font-size:15px;margin-left:8px}
.sz{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.sz span{border:1px solid #555;padding:5px 12px}
.inf .btn{display:block;margin-top:10px}
.ds{margin-top:28px;background:var(--sf);border:1px solid var(--ln);padding:24px;white-space:pre-line}
.ov{position:fixed;inset:0;background:#000c;z-index:60;overflow:auto;padding:16px}
.pn{max-width:820px;margin:0 auto;background:var(--sf);border:1px solid var(--ln);padding:22px}
.pn h3{font:600 26px 'Cormorant Garamond',Georgia,serif;margin:0 0 12px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm .w{grid-column:1/-1}
.fm label{display:flex;flex-direction:column;gap:4px;color:var(--mu);font-size:13px}
.fm input,.fm select,.fm textarea{background:#0f0f11;border:1px solid var(--ln);padding:10px;border-radius:4px}
.fts{display:flex;gap:8px;flex-wrap:wrap}.fts div{position:relative}.fts img{width:64px;height:64px;object-fit:cover}
.fts button{position:absolute;top:-6px;right:-6px;border-radius:50%;border:0;width:20px;height:20px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.row img{width:44px;height:44px;object-fit:cover}.row span{flex:1}
.bar{background:#3a2f00;color:#ffe08a;padding:10px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;justify-content:space-between}
@media(max-width:760px){.pg{grid-template-columns:1fr}.fm{grid-template-columns:1fr}.gal{flex-direction:column-reverse}.th{flex-direction:row}}

html,body{max-width:100%;overflow-x:hidden}
img{max-width:100%}
.inf,.ds,.cn,.pn,.pg>*,.gal>*{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.ds a,.inf a{overflow-wrap:anywhere}
.th{overflow-x:auto;max-width:100%}
.th button{flex:none}
@media(max-width:760px){.pg{grid-template-columns:minmax(0,1fr)!important}.gal{max-width:100%}.ds{padding:18px}.inf{padding:18px}}
.hw{background:radial-gradient(ellipse at 15% 0,#27272c 0,#0a0a0b 70%);border-bottom:1px solid var(--ln)}
.hero{display:flex;align-items:center;gap:30px;padding:46px 18px;max-width:1180px;margin:0 auto}
.hero img{width:120px;filter:drop-shadow(0 0 24px #ffffff44)}
.hero h1{font:600 clamp(32px,6vw,58px)/1.05 'Cormorant Garamond',Georgia,serif;margin:0 0 10px}
.hero p{margin:0 0 22px;max-width:46ch}
.tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:1180px;margin:0 auto;text-align:center;border-top:1px solid var(--ln)}
.tr div{padding:14px 8px;color:var(--mu);font-size:13px}.tr b{display:block;color:var(--tx);font-weight:500;font-size:14px}
.tb{display:flex;justify-content:space-between;align-items:center;gap:10px}
#srt{background:var(--sf);border:1px solid var(--ln);padding:8px 10px;border-radius:4px}
.im{position:relative}
.bd{position:absolute;top:10px;left:10px;background:#f4f4f4;color:#0a0a0b;font-style:normal;font-size:12px;font-weight:600;padding:3px 8px}
.card{transition:border-color .2s}.card:hover{border-color:#777}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:12px}
.ft{border-top:1px solid var(--ln);background:#070708;padding:34px 18px 44px;text-align:center}
.ft img{height:40px}.ft nav{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center;margin:16px 0}
.ft nav button{background:none;border:0;color:var(--mu);cursor:pointer;padding:4px}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#25d366;color:#04210f;font-weight:600;padding:12px 18px;border-radius:99px;box-shadow:0 6px 20px #0008}
@media(max-width:760px){.hero{flex-direction:column;align-items:flex-start;gap:14px;padding:32px 18px}.hero img{width:72px}.tr div{font-size:12px}}
.an{background:#f4f4f4;color:#0a0a0b;text-align:center;padding:8px 12px;font-size:13px;font-weight:500}
.sz1{background:none;border:1px solid #555;padding:5px 12px;cursor:pointer}.sz1.on{background:#f4f4f4;color:#0a0a0b;border-color:#f4f4f4}
.tt{display:flex;justify-content:space-between;margin-top:6px}.tt.b{font-size:20px;font-weight:600;border-top:1px solid var(--ln);padding-top:10px;margin-top:10px}
.back{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 6px 20px #000a}
</style>
</head>

function avl(p){const a=p.avs||[];if(!a.length)return '';const m=a.reduce((s,x)=>s+(+x.e||0),0)/a.length;return `<div class="ds" style="white-space:normal"><h3 class="sf" style="font-size:26px;margin:0 0 4px">Avaliações de clientes</h3><div style="font-size:20px">${st(Math.round(m))} <span class="mu" style="font-size:14px">${m.toFixed(1)} (${a.length})</span></div>${a.map(x=>`<div class="row" style="align-items:flex-start">${x.f?`<img src="${x.f}" alt="" style="width:64px;height:64px">`:''}<span><b>${esc(x.n)}</b> <span aria-label="${x.e} estrelas">${st(+x.e)}</span><br>${esc(x.t)}</span></div>`).join('')}</div>`}
function avlp(){const e=$('#avl');if(e)e.innerHTML=S.ed.avs.map((x,i)=>`<div class="row"><span>${esc(x.n)} ${st(+x.e)}<br><small class="mu">${esc(x.t)}</small></span><button class="btn sm g" data-a="rmav" data-i="${i}">Remover</button></div>`).join('')}
async function addav(){const n=$('#a_n').value.trim(),t=$('#a_t').value.trim();if(!n||!t){alert('Informe o nome e o comentário.');return}const f=$('#a_f').files[0];S.ed.avs.push({n,t,e:+$('#a_e').value,f:f?await shrink(f):''});$('#a_n').value='';$('#a_t').value='';$('#a_f').value='';avlp()}
function cartUI(){const o=$('#cv');o&&o.remove();const L=cl(),sub=L.reduce((a,x)=>a+x.p.preco*x.i.q,0),pct=S.cup&&D.cup?(+D.pct||0):0,ds=sub*pct/100,tot=sub-ds,fm=+D.fmin||0,w=wl();
 const msg='Olá! Quero fazer um pedido na VELUNE:\n'+L.map(x=>`• ${x.i.q}x ${x.p.nome}${x.i.t?' (Tam. '+x.i.t+')':''} - ${brl(x.p.preco*x.i.q)}`).join('\n')+(ds?`\nCupom ${D.cup}: -${brl(ds)}`:'')+`\nTotal: ${brl(tot)}`+(fm&&tot>=fm?'\nFrete grátis':'');
 $('#app').insertAdjacentHTML('beforeend',`<div class="ov" id="cv"><div class="pn"><div style="display:flex;justify-content:space-between"><h3>Seu carrinho</h3><button class="btn sm g" data-a="xc">Fechar</button></div>${L.length?L.map(x=>{const k=esc(x.i.id+'|'+x.i.t),m1='Olá! Quero comprar na VELUNE:\n• '+x.i.q+'x '+x.p.nome+(x.i.t?' (Tam. '+x.i.t+')':'')+'\nTotal: '+brl(x.p.preco*x.i.q),bh=x.p.link||(w?w+'?text='+encodeURIComponent(m1):'');return `<div class="row" style="flex-wrap:wrap">${x.p.fotos&&x.p.fotos[0]?`<img src="${x.p.fotos[0]}" alt="">`:''}<span>${esc(x.p.nome)}<br><small class="mu">${x.i.t?'Tam. '+esc(x.i.t)+' | ':''}${brl(x.p.preco)}</small></span><button class="btn sm g" data-a="qt" data-k="${k}" data-d="-1" aria-label="Menos">−</button><b>${x.i.q}</b><button class="btn sm g" data-a="qt" data-k="${k}" data-d="1" aria-label="Mais">+</button><div style="flex-basis:100%;display:flex;gap:8px;justify-content:flex-end"><button class="btn sm g" data-a="rm" data-k="${k}">Remover</button>${bh?`<a class="btn sm" href="${esc(bh)}" target="_blank" rel="noopener">Comprar</a>`:''}</div></div>`}).join('')+(D.cup?`<div class="row"><input id="cp" placeholder="Cupom de desconto" style="flex:1;background:#0f0f11;border:1px solid var(--ln);padding:10px;border-radius:4px"><button class="btn sm" data-a="cp">Aplicar</button></div>`:'')+`<div class="tt"><span class="mu">Subtotal</span><span>${brl(sub)}</span></div>${ds?`<div class="tt"><span class="mu">Cupom ${esc(D.cup)} (${pct}%)</span><span>-${brl(ds)}</span></div>`:''}${fm?`<p class="mu" style="margin:8px 0 0">${tot>=fm?'Frete grátis aplicado!':'Faltam '+brl(fm-tot)+' para frete grátis.'}</p>`:''}<div class="tt b"><span>Total</span><span>${brl(tot)}</span></div>${w?`<a class="btn" style="display:block;margin-top:14px" href="${w}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">FINALIZAR PEDIDO NO WHATSAPP</a>`:'<p class="mu">A loja ainda não configurou o WhatsApp.</p>'}`:'<p class="mu">Seu carrinho está vazio.</p>'}</div></div>`)}
function lst(){const L=lst0(),o=S.sort;return o==='menor'?L.sort((a,b)=>a.preco-b.preco):o==='maior'?L.sort((a,b)=>b.preco-a.preco):L}
function lst0(){const q=S.q.trim().toLowerCase();return D.p.filter(p=>(S.cat==='Todos'||p.cat===S.cat)&&(!q||(p.nome+' '+p.cat+' '+(p.desc||'')).toLowerCase().includes(q)))}
function grid(){const l=lst();$('#grid').innerHTML=l.length?l.map(cardH).join(''):`<p class="mu empty">${D.p.length?'Nenhum produto encontrado.':'Novos produtos em breve.'}</p>`;$('#cnt').textContent=l.length+(l.length===1?' produto':' produtos');const o=$('#srt');if(o)o.value=S.sort}
function pnl(){const e=S.ed;$('#ov').innerHTML=`<div class="pn"><div style="display:flex;justify-content:space-between"><h3>Painel do dono</h3><button class="btn sm g" data-a="close">Fechar</button></div>${S.dirty?`<div class="bar"><span>Alterações ainda não publicadas para os clientes.</span><button class="btn sm" data-a="pub">Publicar</button></div>`:''}
${e?`<div class="fm"><label class="w">Nome do produto<input id="f_nome" value="${esc(e.nome)}"></label><label>Preço (R$)<input id="f_preco" type="number" step="0.01" value="${e.preco||''}"></label><label>Preço antigo (opcional)<input id="f_antigo" type="number" step="0.01" value="${e.antigo||''}"></label><label>Categoria<select id="f_cat">${CATS.map(c=>`<option ${c===e.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Tamanhos (separe por vírgula)<input id="f_tam" value="${esc(e.tam)}" placeholder="P, M, G"></label><label class="w">Descrição<textarea id="f_desc" rows="4">${esc(e.desc)}</textarea></label><label class="w">Link de compra (opcional)<input id="f_link" value="${esc(e.link)}" placeholder="https://..."></label><label class="w">Link do vídeo (opcional)<input id="f_video" value="${esc(e.video)}" placeholder="https://youtube.com/..."></label><label class="w">Fotos<input id="f_fotos" type="file" accept="image/*" multiple></label><div class="w fts" id="fts"></div><div class="w"><b>Avaliações de clientes</b></div><label>Nome do cliente<input id="a_n"></label><label>Nota<select id="a_e"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label class="w">Comentário<textarea id="a_t" rows="2"></textarea></label><label class="w">Foto do cliente (opcional)<input id="a_f" type="file" accept="image/*"></label><div class="w"><button class="btn sm g" data-a="addav">+ Adicionar avaliação</button></div><div class="w" id="avl"></div><div class="w"><button class="btn sm" data-a="save">Salvar produto</button> <button class="btn sm g" data-a="cancel">Cancelar</button></div></div>`
:`<button class="btn sm" data-a="new">+ Adicionar produto</button><div class="fm" style="margin:14px 0"><label class="w">WhatsApp da loja (com DDD)<input id="f_whats" value="${esc(D.whats)}" placeholder="11999999999"></label><label class="w">Instagram da loja<input id="f_insta" value="${esc(D.insta)}" placeholder="@suaLoja"></label><label>Código do cupom<input id="f_cup" value="${esc(D.cup)}" placeholder="VELUNE10"></label><label>Desconto do cupom (%)<input id="f_pct" type="number" value="${esc(D.pct)}" placeholder="10"></label><label class="w">Frete grátis acima de (R$)<input id="f_fmin" type="number" value="${esc(D.fmin)}" placeholder="299"></label></div>${D.p.map(p=>`<div class="row">${p.fotos&&p.fotos[0]?`<img src="${p.fotos[0]}" alt="">`:''}<span>${esc(p.nome)}<br><small class="mu">${esc(p.cat)} | ${brl(p.preco)}</small></span><button class="btn sm g" data-a="edit" data-id="${p.id}">Editar</button><button class="btn sm g" data-a="del" data-id="${p.id}">Excluir</button></div>`).join('')||'<p class="mu">Nenhum produto ainda.</p>'}`}</div>`;
 if(e){fts();avlp()}}
function fts(){$('#fts').innerHTML=S.ed.fotos.map((s,i)=>`<div><img src="${s}" alt=""><button data-a="rmf" data-i="${i}" aria-label="Remover foto">×</button></div>`).join('')}
function shrink(file){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.78))};im.src=u})}
async function pub(){try{const a=window.claude&&await claude.use('artifact');if(!a){const c0=document.documentElement.cloneNode(true);c0.querySelector('#app').innerHTML='';c0.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');const u=URL.createObjectURL(new Blob(['<!doctype html>\n'+c0.outerHTML],{type:'text/html'})),l=document.createElement('a');l.href=u;l.download='index.html';document.body.appendChild(l);l.click();l.remove();alert('Arquivo index.html baixado. Envie esse arquivo para o GitHub, no lugar do antigo, para atualizar o site.');return}
 const c=document.documentElement.cloneNode(true);c.querySelector('#app').innerHTML='';c.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
 await a.publish('<!doctype html>\n'+c.outerHTML)}catch(e){alert('Não foi possível publicar: '+(e.message||e.code||'erro'))}}
function act(a,d){
 if(a==='enter'){S.v='store';$('#in')&&$('#in').classList.add('out');setTimeout(render,600)}
 else if(a==='shop'){const m=document.getElementById('vit');m&&m.scrollIntoView({behavior:'smooth'})}
 else if(a==='back'){if(history.state&&history.state.p){history.back()}else{S.v='store';render();scrollTo(0,S.sy||0)}}
 else if(a==='home'){S.v='store';render();scrollTo(0,0)}
 else if(a==='cat'){S.cat=d.c;render()}
 else if(a==='open'){if(S.v==='store')S.sy=scrollY;try{history.pushState({p:d.id},'')}catch(e){}S.v='prod';S.pid=d.id;S.img=0;S.tam='';render();scrollTo(0,0)}
 else if(a==='img'){S.img=+d.i;render()}
 else if(a==='panel'){S.panel=true;S.ed=null;render()}
 else if(a==='close'){S.panel=false;render()}
 else if(a==='new'){S.ed={nome:'',preco:'',antigo:'',cat:CATS[0],tam:'',desc:'',link:'',video:'',fotos:[],avs:[]};pnl()}
 else if(a==='edit'){S.ed=JSON.parse(JSON.stringify(D.p.find(p=>p.id===d.id)));S.ed.avs=S.ed.avs||[];pnl()}
 else if(a==='cancel'){S.ed=null;pnl()}
 else if(a==='del'){if(confirm('Excluir este produto?')){D.p=D.p.filter(p=>p.id!==d.id);S.dirty=true;render()}}
 else if(a==='rmf'){S.ed.fotos.splice(+d.i,1);fts()}
 else if(a==='save'){const g=i=>$('#f_'+i).value.trim(),e=S.ed;e.nome=g('nome');e.preco=parseFloat(g('preco'));e.antigo=parseFloat(g('antigo'))||0;e.cat=g('cat');e.tam=g('tam');e.desc=g('desc');e.link=g('link');e.video=g('video');
  if(!e.nome||!(e.preco>=0)){alert('Informe o nome e o preço.');return}
  const i=D.p.findIndex(p=>p.id===e.id);if(i>=0)D.p[i]=e;else{e.id=Date.now().toString(36);D.p.unshift(e)}S.ed=null;S.dirty=true;render()}
 else if(a==='tam'){S.tam=d.t;document.querySelectorAll('.sz1').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tam))}
 else if(a==='add'){const p=D.p.find(x=>x.id===d.id);if(p.tam&&!S.tam){alert('Escolha um tamanho.');return}const t=p.tam?S.tam:'',k=C.find(i=>i.id===p.id&&i.t===t);k?k.q++:C.push({id:p.id,t,q:1});svC();S.cart=true;cartUI();cc()}
 else if(a==='cart'){S.cart=true;cartUI()}
 else if(a==='xc'){S.cart=false;const o=$('#cv');o&&o.remove()}
 else if(a==='qt'){const x=d.k.split('|'),k=C.find(i=>i.id===x[0]&&i.t===x[1]);if(k){k.q+=+d.d;if(k.q<1)C=C.filter(i=>i!==k)}svC();cartUI();cc()}
 else if(a==='rm'){const x=d.k.split('|');C=C.filter(i=>!(i.id===x[0]&&i.t===x[1]));svC();cartUI();cc()}
 else if(a==='cp'){const v=($('#cp').value||'').trim().toUpperCase();if(D.cup&&v===String(D.cup).toUpperCase()){S.cup=true;cartUI()}else alert('Cupom inválido.')}
 else if(a==='addav')addav()
 else if(a==='rmav'){S.ed.avs.splice(+d.i,1);avlp()}
 else if(a==='pub')pub()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();act(t.dataset.a,t.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;if(S.v==='store')grid()}{const m={f_whats:'whats',f_insta:'insta',f_cup:'cup',f_pct:'pct',f_fmin:'fmin'}[e.target.id];if(m){D[m]=e.target.value;S.dirty=true}}});
document.addEventListener('change',async e=>{if(e.target.id==='srt'){S.sort=e.target.value;grid();return}if(e.target.id==='f_fotos'&&S.ed){for(const f of e.target.files)S.ed.fotos.push(await shrink(f));e.target.value='';fts()}});
addEventListener('popstate',e=>{const q=e.state&&e.state.p;if(q){S.v='prod';S.pid=q;S.img=0;S.tam='';render();scrollTo(0,0)}else if(S.v==='prod'){S.v='store';render();scrollTo(0,S.sy||0)}});
render();setTimeout(()=>{if(S.v==='intro')act('enter',{})},4200);
</script>
